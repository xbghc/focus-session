name: focus-session

services:
  server:
    image: ${FOCUS_SERVER_IMAGE:?Set FOCUS_SERVER_IMAGE to a published version or digest in .env}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://focus:${POSTGRES_PASSWORD:?Set a random hex POSTGRES_PASSWORD in .env}@postgres:5432/focus
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-https://appassets.androidplatform.net}
      MAX_JSON_BYTES: ${MAX_JSON_BYTES:-16777216}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-33554432}
      MAX_USER_BLOB_BYTES: ${MAX_USER_BLOB_BYTES:-2147483648}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8787}:3000"
    volumes:
      - article-files:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: focus
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hex POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database:
  article-files:
