<!doctype html>

<x-dc>

  <style>

    a { color: #a4551f; text-decoration: none; }

<div style="width: 560px; height: 520px; background: #f2ede4; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: hidden">

  <div style="background: #fffdfa; border: 1px solid #e0d8cb; border-radius: 3px; box-shadow: 0 1px 2px rgba(31, 27, 22, 0.05), 0 10px 28px rgba(31, 27, 22, 0.08); display: flex; flex-direction: column; overflow: hidden; color: #1f1b16">

    <div style="height: 3px; background: #a4551f"></div>

    <!-- 正面留白是刻意的：这一面的作用是让人想，不是让人读 -->
    <div style="padding: 54px 28px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px">

      <div style="font-size: 42px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1">leak</div>

      <div style="display: flex; align-items: baseline; gap: 10px">
        <div style="font-size: 14px; color: #6f6558; font-style: italic">/liːk/</div>
        <div style="font-size: 13px; color: #6f6558">verb</div>
      </div>

      <div style="font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; font-size: 11.5px; color: #9a8f7f; font-variant-numeric: tabular-nums; margin-top: 34px">
        出现在 2 篇文章 · 第 3 次复习
      </div>

      <div style="display: flex; align-items: center; gap: 9px; border: 1px solid #ddd5c8; border-radius: 3px; padding: 9px 20px; margin-top: 10px; background: #faf7f2">
        <div style="font-size: 14px; color: #1f1b16">显示答案</div>
        <div style="font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; font-size: 11px; color: #8a7f70; background: #efe8dc; border-radius: 2px; padding: 1px 7px">空格</div>
      </div>

    </div>
  </div>

</div>
