<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <style>
    body {
      margin: 0;
      font-family: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #a4551f; text-decoration: none; }
    a:hover { color: #7d3f16; text-decoration: underline; }
  </style>
</helmet>

<div style="width: 560px; height: 520px; background: #f2ede4; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: hidden">

  <div style="background: #fffdfa; border: 1px solid #e0d8cb; border-radius: 3px; box-shadow: 0 1px 2px rgba(31, 27, 22, 0.05), 0 10px 28px rgba(31, 27, 22, 0.08); display: flex; flex-direction: column; overflow: hidden; color: #1f1b16">

    <div style="height: 3px; background: #a4551f"></div>

    <div style="padding: 24px 28px 22px; display: flex; flex-direction: column; gap: 13px">

      <div style="display: flex; align-items: baseline; gap: 10px">
        <div style="font-size: 32px; font-weight: 600; letter-spacing: -0.01em">leak</div>
        <div style="font-size: 13px; color: #6f6558; font-style: italic">/liːk/</div>
        <div style="font-size: 12.5px; color: #6f6558; flex-grow: 1">verb</div>
        <div style="font-size: 11.5px; color: #9a8f7f; font-variant-numeric: tabular-nums">第 3 次</div>
      </div>

      <div style="font-size: 20px; line-height: 1.45">泄漏</div>

      <div style="font-size: 13.5px; line-height: 1.85; color: #4a4238">此处为比喻用法，指抽象层在实际使用中暴露出与底层实现不一致的缺陷或问题。</div>

      <div style="border-top: 1px solid #eee7dc; padding-top: 13px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13.5px; line-height: 1.7; color: #4a4238; font-style: italic">Every abstraction <span style="background: #f6e4d3; padding: 0 2px; border-radius: 2px; font-style: normal">leaks</span>. The question is not whether it leaks, but whether the leak is cheaper than the thing it hides.</div>
        <div style="font-size: 11.5px; color: #8a7f70">《The Hidden Cost of Abstraction》 · 出现在 2 篇文章</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 3px">
        <div style="border: 1px solid #ddd5c8; border-radius: 3px; padding: 9px 3px; text-align: center; background: #fffdfa">
          <div style="font-size: 13px">忘了</div>
          <div style="font-size: 10.5px; color: #8a7f70; margin-top: 2px; font-variant-numeric: tabular-nums">10 分钟</div>
        </div>
        <div style="border: 1px solid #ddd5c8; border-radius: 3px; padding: 9px 3px; text-align: center; background: #fffdfa">
          <div style="font-size: 13px">有点难</div>
          <div style="font-size: 10.5px; color: #8a7f70; margin-top: 2px; font-variant-numeric: tabular-nums">2 天</div>
        </div>
        <div style="border: 1px solid #a4551f; border-radius: 3px; padding: 9px 3px; text-align: center; background: #a4551f; color: #fffdfa">
          <div style="font-size: 13px">记得</div>
          <div style="font-size: 10.5px; margin-top: 2px; color: #f3d9c4; font-variant-numeric: tabular-nums">5 天</div>
        </div>
        <div style="border: 1px solid #ddd5c8; border-radius: 3px; padding: 9px 3px; text-align: center; background: #fffdfa">
          <div style="font-size: 13px">太简单</div>
          <div style="font-size: 10.5px; color: #8a7f70; margin-top: 2px; font-variant-numeric: tabular-nums">12 天</div>
        </div>
      </div>

      <div style="display: flex; gap: 7px; align-items: center; margin-top: 2px">
        <div style="border: 1px solid #ddd5c8; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: #4a4238">再给个例句</div>
        <div style="border: 1px solid #ddd5c8; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: #4a4238">换个说法讲</div>
        <div style="border: 1px solid #ddd5c8; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: #4a4238">考我一下</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
