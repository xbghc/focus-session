name: Release

# 打一个 v* 标签就发版：核对版本号、跑完整检查、把扩展打成 zip、打 APK，
# 一起挂到 GitHub Release 上。
#
# APK 默认是 debug 签名的——runner 每次生成的 debug 密钥都不一样，手机上装第二个版本
# 得先卸载第一个。仓库里配了四个 Secret（见 README「持续集成与发布」）时改出正式签名的包。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 标签要和 package.json 的版本号一致
        run: |
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "标签是 $GITHUB_REF_NAME，package.json 里是 $WANT；用 npm version 打标签就不会错" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: 打包扩展
        run: (cd dist && zip -qr "../focus-session-extension-${GITHUB_REF_NAME}.zip" .)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: 正式签名的 APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FS_KEYSTORE_FILE"
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "../focus-session-${GITHUB_REF_NAME}.apk"

      - name: debug 签名的 APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "../focus-session-${GITHUB_REF_NAME}-debug.apk"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" focus-session-*.zip focus-session-*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
